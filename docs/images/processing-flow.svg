<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1560" viewBox="0 0 1340 1560" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4b4a6"/></marker></defs><rect width="1340" height="1560" fill="#ffffff"/><text x="42" y="60" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a" text-anchor="start" >Code computes the numbers, models only classify and explain</text><rect x="212" y="113" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="157" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >1. Autocomplete</text><text x="240" y="189" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >company or branch, via our API and the gateway</text><rect x="212" y="254" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="298" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >2. Company verification (ARES)</text><text x="240" y="330" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >the pipeline gets a place_id or a company ID (IČO)</text><polygon points="477.0,375.0 619.5,431 477.0,487.0 334.5,431" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="477.0" y="439" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1a1a1a" text-anchor="middle" >Cache fresh?</text><rect x="849" y="382" width="424" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="877" y="426" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >Result from cache</text><text x="877" y="458" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >straight to the dashboard, no cost</text><rect x="212" y="545" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="589" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >3. Scraping (Apify)</text><text x="240" y="621" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >via the gateway, new reviews only</text><rect x="212" y="686" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="730" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >4. Cleaning and guardrails</text><text x="240" y="762" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >PII, deduplication, injection (JEV)</text><rect x="849" y="686" width="424" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="877" y="730" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >Excluded reviews</text><text x="877" y="762" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >flagged in DB, left out of analysis</text><rect x="212" y="827" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="871" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >5. Classification (JEV)</text><text x="240" y="903" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >via the gateway, in batches</text><rect x="212" y="968" width="530" height="100" rx="14" fill="#e4eef9" stroke="#2b6fd6" stroke-width="3"/><text x="240" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >6. Computations in code</text><text x="240" y="1044" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >averages, trends, drops and rises</text><rect x="212" y="1110" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="1154" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >7. Analysis (Sonnet)</text><text x="240" y="1186" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >via the gateway: summary, drops, suggestions</text><polygon points="477.0,1231.0 619.5,1287 477.0,1343.0 334.5,1287" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="477.0" y="1295" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#1a1a1a" text-anchor="middle" >Output OK?</text><rect x="849" y="1238" width="424" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="877" y="1282" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >Retry, then fallback</text><text x="877" y="1314" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >schema, grounding on review IDs</text><rect x="212" y="1400" width="530" height="100" rx="14" fill="#ffffff" stroke="#c9c9bd" stroke-width="2"/><text x="240" y="1444" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a" text-anchor="start" >8. Storage and dashboard</text><text x="240" y="1476" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >result, run cost, status</text><path d="M477.0,213 L477.0,254" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,354 L477.0,375" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,487 L477.0,545" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,645 L477.0,686" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,786 L477.0,827" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,927 L477.0,968" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,1068 L477.0,1110" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,1210 L477.0,1231" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M477.0,1343 L477.0,1400" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M619.0,431 L849,431" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><text x="733" y="414" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="middle" >yes</text><text x="495.0" y="523" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >no</text><path d="M742,736 L849,736" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><text x="795" y="716" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="middle" >suspicious</text><path d="M619.0,1287 L849,1287" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><text x="790" y="1268" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="middle" >no</text><text x="495.0" y="1370" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="start" >yes</text><path d="M1061,1238 L1061,1160 L742,1160" fill="none" stroke="#b4b4a6" stroke-width="2.5" marker-end="url(#a)"/><path d="M184,545 L200,545 L200,1210 L184,1210" fill="none" stroke="#2b6fd6" stroke-width="2.5" /><g transform="translate(150,877) rotate(-90)"><text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#5b5b55" text-anchor="middle" >paid calls only via the gateway: Budget check, limits, log</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>