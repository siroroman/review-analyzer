# Module boundaries (ADR-0004, docs/specification.md). Guardrail path: a change needs a "Guardrails touched" line.
# Whoever adds a module under app/ adds it to every contract below in the same PR.
[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:layers]
name = Dependencies go one way
type = layers
# Higher layers may import lower ones, never the reverse. Order grows toward: api | worker, pipeline, domain modules, domain.
layers =
    app.storage
    app.metrics | app.gateway
    app.budget
    app.domain

[importlinter:contract:internals-domain]
name = Internals are private (domain)
type = protected
# A module's non-public files (everything but its __init__) are imported only from inside that module.
# One contract per module: add one when a module is added.
protected_modules =
    app.domain._analysis
    app.domain._base
    app.domain._clock
    app.domain._places
    app.domain._reviews
    app.domain._run_status
    app.domain._topics
allowed_importers =
    app.domain

[importlinter:contract:internals-metrics]
name = Internals are private (metrics)
type = protected
protected_modules =
    app.metrics._average
    app.metrics._compute
allowed_importers =
    app.metrics

[importlinter:contract:internals-budget]
name = Internals are private (budget)
type = protected
protected_modules =
    app.budget._budget
    app.budget._estimate
allowed_importers =
    app.budget

[importlinter:contract:internals-gateway]
name = Internals are private (gateway)
type = protected
# Adapters of paid services (OpenRouter, Anthropic, Apify, Google Places) will live inside app.gateway and
# are private to it, so they are reachable through the gateway only (ADR-0006). Add them here when they arrive.
protected_modules =
    app.gateway._fakes
    app.gateway._gateway
    app.gateway._types
allowed_importers =
    app.gateway

[importlinter:contract:budget-via-gateway]
name = Only the gateway imports budget
type = forbidden
# ADR-0006: gateway is the only caller of budget. List every module except gateway; add a new module here
# in the PR that creates it.
source_modules =
    app.domain
    app.metrics
forbidden_modules =
    app.budget

[importlinter:contract:pure]
name = No network library in pure modules
type = forbidden
# Pure modules do no I/O. Add `sanitize` here when it exists.
source_modules =
    app.domain
    app.metrics
    app.budget
forbidden_modules =
    httpx
    requests
    aiohttp
    urllib3
    urllib
    http
    socket
    sqlalchemy
    psycopg
    asyncpg
allow_indirect_imports = True

[importlinter:contract:internals-storage]
name = Internals are private (storage)
type = protected
protected_modules =
    app.storage._memory
    app.storage._storage
    app.storage._types
allowed_importers =
    app.storage
