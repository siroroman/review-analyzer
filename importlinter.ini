# Module boundaries (ADR-0004, docs/specification.md). Guardrail path: a change needs a "Guardrails touched" line.
# Whoever adds a module under app/ adds it to every contract below in the same PR.
[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:layers]
name = Dependencies go one way
type = layers
# Higher layers may import lower ones, never the reverse. Order grows toward: api | worker, pipeline, domain modules, domain.
layers =
    app.metrics
    app.domain

[importlinter:contract:internals-domain]
name = Internals are private (domain)
type = protected
# A module's non-public files (everything but its __init__) are imported only from inside that module.
# One contract per module: add one when a module is added.
protected_modules =
    app.domain._analysis
    app.domain._base
    app.domain._clock
    app.domain._places
    app.domain._reviews
    app.domain._run_status
    app.domain._topics
allowed_importers =
    app.domain

[importlinter:contract:internals-metrics]
name = Internals are private (metrics)
type = protected
protected_modules =
    app.metrics._average
    app.metrics._compute
allowed_importers =
    app.metrics

[importlinter:contract:pure]
name = No network library in pure modules
type = forbidden
# Pure modules do no I/O. Add `budget` and `sanitize` here when they exist.
source_modules =
    app.domain
    app.metrics
forbidden_modules =
    httpx
    requests
    aiohttp
    urllib3
    urllib
    http
    socket
    sqlalchemy
    psycopg
    asyncpg
allow_indirect_imports = True
