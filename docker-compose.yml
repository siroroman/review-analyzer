# Local development only: a PostgreSQL for `make run-api`. Not used in any deployment.
# `DATABASE_URL=postgresql://review_analyzer:review_analyzer@localhost:5433/review_analyzer`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review_analyzer
      POSTGRES_PASSWORD: review_analyzer # a local-only value; the port below is bound to this machine
      POSTGRES_DB: review_analyzer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_analyzer -d review_analyzer"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
